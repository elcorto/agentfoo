[project]
name = "oc-sessions"
version = "0.1.0"
description = "Manage opencode sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "textual",
]


[project.scripts]
oc-sessions = "oc_sessions.cli:oc_sessions"


[tool.ruff]
line-length = 79
lint.ignore = [
    "E501", # Line too long
    "E731", # Do not assign a lambda expression, use a def
    # Since ruff 0.16
    "C408", # Unnecessary `dict()` call (rewrite as a literal)
    "SIM118", # Use `key in dict` instead of `key in dict.keys()`
]


[build-system]
requires = ["setuptools>=66.1", "wheel"]
build-backend = "setuptools.build_meta"
